<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>kalkulator retro html</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "calc-bg": "#F8F1E5",
              "stripe-orange": "#DF663A",
              "stripe-yellow": "#F1C07C",
              "screen-bg": "#C5D1B5",
              "screen-border": "#1E201C",
              "keypad-bg": "#E9E2D8",
              "text-orange": "#DA813B",
            },
          },
        },
      };
    </script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body
    class="bg-gray-200 dark:bg-gray-900 flex items-center justify-center min-h-screen p-4 font-sans selection:bg-none overflow-x-hidden transition-colors duration-300"
  >
    <div
      id="menu-backdrop"
      class="fixed inset-0 bg-black/50 z-40 hidden opacity-0 transition-opacity duration-300"
      onclick="toggleMenu()"
    ></div>
    <div
      id="menu-sidebar"
      class="fixed top-0 left-0 w-72 h-full bg-calc-bg dark:bg-gray-800 z-50 transform -translate-x-full transition-transform duration-300 shadow-2xl flex flex-col border-r-[8px] border-black dark:border-gray-950"
    >
      <div
        class="p-6 border-b border-gray-300 dark:border-gray-700 flex justify-between items-center"
      >
        <h2 class="text-xl font-bold text-gray-800 dark:text-gray-100">Menu</h2>
        <button
          onclick="toggleMenu()"
          class="text-gray-600 dark:text-gray-400 hover:text-black font-bold text-2xl"
        >
          &times;
        </button>
      </div>
      <div class="p-6 flex-grow overflow-y-auto flex flex-col gap-6">
        <button
          onclick="toggleTheme()"
          class="w-full flex items-center justify-between p-3 rounded-xl bg-keypad-bg dark:bg-gray-700 text-gray-800 dark:text-gray-100 shadow-inner font-medium"
        >
          <span id="theme-text">Dark Mode</span>
          <div
            class="w-10 h-6 bg-gray-400 dark:bg-stripe-orange rounded-full p-1 flex items-center"
          >
            <div
              id="theme-knob"
              class="w-4 h-4 bg-white rounded-full shadow-md transform transition-transform duration-300"
            ></div>
          </div>
        </button>
        <div>
          <p
            class="text-sm font-semibold text-gray-500 dark:text-gray-400 mb-3 uppercase"
          >
            Modes
          </p>
          <div class="flex flex-col gap-2" id="mode-selectors">
            <button
              onclick="setMode('standard')"
              class="mode-btn active bg-stripe-orange text-white p-3 rounded-xl font-medium shadow-md text-left transition-colors"
            >
              Standard
            </button>
            <button
              onclick="setMode('scientific')"
              class="mode-btn bg-keypad-bg dark:bg-gray-700 text-gray-800 dark:text-gray-100 p-3 rounded-xl font-medium text-left transition-colors"
            >
              Scientific
            </button>
            <button
              onclick="setMode('programmer')"
              class="mode-btn bg-keypad-bg dark:bg-gray-700 text-gray-800 dark:text-gray-100 p-3 rounded-xl font-medium text-left transition-colors"
            >
              Programmer
            </button>
            <button
              onclick="setMode('currency')"
              class="mode-btn bg-keypad-bg dark:bg-gray-700 text-gray-800 dark:text-gray-100 p-3 rounded-xl font-medium text-left transition-colors"
            >
              Currency
            </button>
            <button
              onclick="setMode('temperature')"
              class="mode-btn bg-keypad-bg dark:bg-gray-700 text-gray-800 dark:text-gray-100 p-3 rounded-xl font-medium text-left transition-colors"
            >
              Temperature
            </button>
          </div>
        </div>
      </div>
    </div>

    <div
      class="relative w-full max-w-[380px] md:max-w-[760px] bg-calc-bg dark:bg-gray-800 rounded-[40px] shadow-2xl overflow-hidden border-[10px] border-black dark:border-gray-950 flex flex-col md:flex-row p-6 gap-6 transition-colors duration-300"
    >
      <div class="flex flex-col md:w-1/2 z-10 relative">
        <div class="flex justify-between items-center mb-6 mt-2">
          <div class="cursor-pointer hover:opacity-70" onclick="toggleMenu()">
            <div
              class="w-8 h-1.5 bg-black dark:bg-gray-300 rounded-full mb-1.5"
            ></div>
            <div
              class="w-5 h-1.5 bg-black dark:bg-gray-300 rounded-full mb-1.5"
            ></div>
            <div class="w-8 h-1.5 bg-black dark:bg-gray-300 rounded-full"></div>
          </div>
          <span
            id="calc-title"
            class="font-bold text-gray-400 dark:text-gray-500 tracking-widest text-sm uppercase"
            >Standard</span
          >
        </div>

        <div
          class="bg-screen-bg dark:bg-gray-700 border-4 border-screen-border dark:border-gray-900 rounded-2xl h-44 md:h-full min-h-[170px] flex flex-col justify-end p-5 shadow-inner mt-auto relative"
        >
          <div
            id="screen-std"
            class="flex flex-col items-end justify-end h-full w-full"
          >
            <div
              id="history"
              class="text-gray-600 dark:text-gray-400 font-medium text-lg tracking-widest mb-1 min-h-[28px]"
            ></div>
            <div
              id="result"
              class="text-screen-border dark:text-gray-100 font-bold text-5xl overflow-hidden break-all text-right"
            >
              0
            </div>
          </div>

          <div
            id="screen-currency"
            class="hidden flex flex-col justify-between h-full w-full"
          >
            <div
              class="flex justify-between items-center border-b border-gray-400 dark:border-gray-500 pb-2"
            >
              <select
                id="curr-from"
                class="bg-calc-bg dark:bg-gray-800 text-gray-800 dark:text-white font-bold outline-none cursor-pointer p-1 rounded-md appearance-none border border-gray-400 pr-6 relative"
              ></select>
              <div
                id="curr-input"
                class="text-2xl font-bold text-screen-border dark:text-white"
              >
                0
              </div>
            </div>
            <div class="flex justify-between items-center pt-2">
              <select
                id="curr-to"
                class="bg-calc-bg dark:bg-gray-800 text-gray-800 dark:text-white font-bold outline-none cursor-pointer p-1 rounded-md appearance-none border border-gray-400 pr-6 relative"
              ></select>
              <div
                id="curr-output"
                class="text-3xl font-bold text-stripe-orange"
              >
                0
              </div>
            </div>
          </div>

          <div
            id="screen-temp"
            class="hidden flex flex-col justify-between h-full w-full"
          >
            <div
              class="flex justify-between items-center border-b border-gray-400 dark:border-gray-500 pb-2"
            >
              <select
                id="temp-from"
                onchange="updateTempUI()"
                class="bg-calc-bg dark:bg-gray-800 text-gray-800 dark:text-white font-bold outline-none cursor-pointer p-1 rounded-md appearance-none border border-gray-400"
              >
                <option value="C">Celsius (°C)</option>
                <option value="F">Fahrenheit (°F)</option>
                <option value="K">Kelvin (K)</option>
              </select>
              <div
                id="temp-input"
                class="text-2xl font-bold text-screen-border dark:text-white"
              >
                0
              </div>
            </div>
            <div class="flex justify-between items-center pt-2">
              <select
                id="temp-to"
                onchange="updateTempUI()"
                class="bg-calc-bg dark:bg-gray-800 text-gray-800 dark:text-white font-bold outline-none cursor-pointer p-1 rounded-md appearance-none border border-gray-400"
              >
                <option value="F">Fahrenheit (°F)</option>
                <option value="C">Celsius (°C)</option>
                <option value="K">Kelvin (K)</option>
              </select>
              <div
                id="temp-output"
                class="text-3xl font-bold text-stripe-orange"
              >
                32
              </div>
            </div>
          </div>

          <div
            id="screen-prog"
            class="hidden flex flex-col h-full w-full text-sm font-mono text-gray-700 dark:text-gray-300 space-y-1"
          >
            <div
              class="flex justify-between cursor-pointer"
              onclick="setProgBase(16)"
            >
              <span>HEX</span><span id="prog-hex">0</span>
            </div>
            <div
              class="flex justify-between cursor-pointer text-stripe-orange font-bold text-base"
              onclick="setProgBase(10)"
              id="prog-dec-row"
            >
              <span>DEC</span><span id="prog-dec">0</span>
            </div>
            <div
              class="flex justify-between cursor-pointer"
              onclick="setProgBase(8)"
            >
              <span>OCT</span><span id="prog-oct">0</span>
            </div>
            <div
              class="flex justify-between cursor-pointer"
              onclick="setProgBase(2)"
            >
              <span>BIN</span
              ><span id="prog-bin" class="break-all text-right max-w-[200px]"
                >0</span
              >
            </div>
          </div>
        </div>
      </div>

      <div
        class="md:w-1/2 z-10 bg-keypad-bg dark:bg-gray-900 rounded-3xl p-5 flex-grow shadow-inner transition-colors duration-300"
      >
        <div id="keypad-container" class="grid gap-3 h-full"></div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
